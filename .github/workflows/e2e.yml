name: End-to-end tests

# Every push starts the real stack (n8n + the mock services) on a fresh runner,
# loads and publishes the workflows with the same script people use locally,
# and runs the whole scenario suite against it, outages included.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Pipeline end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start n8n and the mock services, load and publish the workflows
        run: ./scripts/setup.sh

      - name: Run the end-to-end tests
        run: python3 tests/run_tests.py

      - name: Show the container logs
        if: failure()
        run: docker compose logs --no-color --tail=300
